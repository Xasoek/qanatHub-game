      oxygen: preset.oxygen ?? oxygen,
      food: preset.food ?? food,
      damage: preset.damage ?? 0,

    if (STATE.fatigue >= penalty.fatigueAt) cubes -= penalty.fatigue;
    for (const item of STATE.pending) {
