<title>One Sol to Rescue</title>
<style>
/* src/style.css */
:root {
  color-scheme: dark;
  font-family: system-ui, sans-serif;
  background: #0d1b30;
  color: #fff3e6;
}
body {
  margin: 0;
}
main {
  box-sizing: border-box;
  max-width: 48rem;
  margin: auto;
  padding: 1rem;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}
h1 {
  font-size: clamp(1.5rem, 5vw, 2.75rem);
  margin: 0;
}
.resources {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.5rem;
}
.resources > div {
  background: #172f56;
  border-radius: 0.5rem;
  padding: 0.65rem;
}
dd {
  margin: 0;
  font-weight: 700;
  font-size: 1.5rem;
}
svg {
  display: block;
  width: 100%;
  border-radius: 0.5rem;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}
button {
  min-width: 44px;
  min-height: 44px;
  padding: 0.5rem 0.75rem;
  border: 1px solid #7592bd;
  border-radius: 0.5rem;
  background: #172f56;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
button:disabled {
  opacity: 0.58;
  cursor: default;
}
button:focus-visible {
  outline: 2px solid #ffc38d;
  outline-offset: 3px;
}
</style>

<body>
<main id="game"></main>
<script>
(() => {
  // src/art.js
  function renderBase() {
    return `<svg viewBox="0 0 600 220" aria-hidden="true" focusable="false">
    <rect width="600" height="220" fill="#793747"/>
    <circle cx="470" cy="70" r="40" fill="#f7b586"/>
    <path d="M0 163 100 120l75 35 106-48 118 53 105-18 96 34v44H0Z" fill="#c36750"/>
    <path d="M0 184q200-38 350-5t250-4v45H0Z" fill="#e39465"/>
    <path d="M182 180v-22a54 54 0 0 1 108 0v22Z" fill="#dee7ee"/>
    <path d="M204 150h64l-9 17h-46Z" fill="#426a94"/>
    <path d="M288 180v-13h28v-15a35 35 0 0 1 70 0v28Z" fill="#82b6a7"/>
    <path d="M430 178v-28m54 28v-28m54 28v-28" stroke="#273c55" stroke-width="5"/>
    <path d="M405 153l13-23h40l-13 23zm54 0 13-23h40l-13 23zm54 0 13-23h40l-13 23z" fill="#203653" stroke="#97b7d6" stroke-width="2"/>
  </svg>`;
  }

  // src/config.js
  var CONFIG = {
    missionSols: 30,
    phasesMs: { morning: 15e3, day: 75e3, evening: 2e4, night: 1e4 },
    speeds: [1, 2, 4],
    defaults: { site: "gale", difficulty: "engineer", crop: "radish", seed: 0 },
    sites: ["gale", "jezero", "arcadia"],
    difficulties: {
      cadet: { oxygen: 18, food: 24, stormDecisionMs: 15e3 },
      engineer: { oxygen: 15, food: 20, stormDecisionMs: 1e4 }
    },
    cubesByWeather: { clear: 6, dusty: 4, storm: 2 },
    panels: 4,
    crops: {
      lettuce: { sols: 4, food: 2 },
      radish: { sols: 5, food: 3 },
      potato: { sols: 8, food: 6 }
    },
    systems: ["air", "farm", "repair", "heat", "comms", "science"],
    airUseByCubes: [1, 0.5, 0],
    foodUsePerSol: 1,
    damageLimit: 100
  };

  // src/data.js
  var NASA_ARCHIVE = [];
  async function loadSolarData({ mode = "archive" } = {}) {
    return {
      mode: "archive",
      flares: structuredClone(NASA_ARCHIVE),
      asOf: null,
      noticeKey: mode === "live" ? "solar.liveUnavailable" : null
    };
  }

  // src/engine.js
  var STATE;
  var phases = Object.keys(CONFIG.phasesMs);
  var listeners = new Map(["event", "phase", "gameover"].map((type) => [type, /* @__PURE__ */ new Set()]));
  var elapsedInPhase = 0;
  function emit(type, payload) {
    for (const listener of listeners.get(type)) listener(payload);
  }
  function resetAllocation() {
    return Object.fromEntries(CONFIG.systems.map((system) => [system, 0]));
  }
  function newGame({
    site = CONFIG.defaults.site,
    difficulty = CONFIG.defaults.difficulty,
    seed = CONFIG.defaults.seed,
    solarData
  } = {}) {
    if (!CONFIG.sites.includes(site)) throw new RangeError(`Unknown site: ${site}`);
    if (!Object.hasOwn(CONFIG.difficulties, difficulty)) {
      throw new RangeError(`Unknown difficulty: ${difficulty}`);
    }
    const { oxygen, food } = CONFIG.difficulties[difficulty];
    elapsedInPhase = 0;
    STATE = {
      sol: 1,
      phase: "morning",
      speed: 1,
      paused: false,
      status: "playing",
      site,
      difficulty,
      oxygen,
      food,
      damage: 0,
      cubes: CONFIG.cubesByWeather.clear,
      alloc: resetAllocation(),
      panels: { total: CONFIG.panels, broken: 0, dusty: 0 },
      crop: { type: CONFIG.defaults.crop, progress: 0 },
      dose: 0,
      fatigue: 0,
      crates: 0,
      stars: 0,
      weather: "clear",
      forecast: null,
      scrubberBroken: false,
      pending: [],
      log: [],
      solarMode: solarData?.mode ?? "archive",
      flares: structuredClone(solarData?.flares ?? []),
      seed
    };
    return STATE;
  }
  function allocate(system, delta) {
    if (STATE.status !== "playing" || STATE.phase !== "day" || !CONFIG.systems.includes(system) || !Number.isInteger(delta) || STATE.alloc[system] + delta < 0 || STATE.cubes - delta < 0) return false;
    STATE.alloc[system] += delta;
    STATE.cubes -= delta;
    return true;
  }
  function setPhase(phase) {
    STATE.phase = phase;
    if (phase === "evening") STATE.cubes = 0;
    elapsedInPhase = 0;
    emit("phase", { sol: STATE.sol, phase });
  }
  function finishSol() {
    const airIndex = Math.min(STATE.alloc.air, CONFIG.airUseByCubes.length - 1);
    const oxygen = Math.min(STATE.oxygen, CONFIG.airUseByCubes[airIndex]);
    const food = Math.min(STATE.food, CONFIG.foodUsePerSol);
    STATE.oxygen -= oxygen;
    STATE.food -= food;
    STATE.log.push({ sol: STATE.sol, choice: "endSol", cost: { oxygen, food }, note: null });
    if (!STATE.oxygen || !STATE.food || STATE.damage >= CONFIG.damageLimit) {
      STATE.status = "emergencySleep";
    } else if (STATE.sol >= CONFIG.missionSols) {
      STATE.status = "rescued";
    }
    if (STATE.status !== "playing") {
      emit("gameover", getEndReport());
      return;
    }
    STATE.sol += 1;
    STATE.cubes = CONFIG.cubesByWeather[STATE.weather];
    STATE.alloc = resetAllocation();
    setPhase("morning");
  }
  function endSol() {
    if (STATE.status !== "playing" || !["morning", "day"].includes(STATE.phase)) return false;
    setPhase("evening");
    return true;
  }
  function tick(dtMs) {
    if (!Number.isFinite(dtMs) || dtMs < 0) throw new RangeError("dtMs must be non-negative and finite");
    if (STATE.paused || STATE.status !== "playing") return;
    let remaining = dtMs * STATE.speed;
    while (remaining > 0 && !STATE.paused && STATE.status === "playing") {
      const timeLeft = CONFIG.phasesMs[STATE.phase] - elapsedInPhase;
      if (remaining < timeLeft) {
        elapsedInPhase += remaining;
        return;
      }
      remaining -= timeLeft;
      const next = phases[phases.indexOf(STATE.phase) + 1];
      if (next) setPhase(next);
      else finishSol();
    }
  }
  function skipToDecision() {
    if (STATE.paused || STATE.status !== "playing") return false;
    if (STATE.phase === "morning") {
      setPhase("day");
      return true;
    }
    return false;
  }
  function getEndReport() {
    return { status: STATE.status, sol: STATE.sol, chains: [] };
  }
  newGame();

  // src/text.js
  var TEXT = {
    en: {
      game: {
        title: "One Sol to Rescue",
        intro: "Keep the Mars base running until help arrives.",
        turn: "Sol {sol} of {total} · {phase}",
        oxygen: "Oxygen",
        food: "Food",
        energy: "Energy",
        addAir: "Power the air scrubber",
        next: "Start day",
        end: "End sol",
        advance: "Apply sol results",
        restart: "Restart",
        emergencySleep: "Emergency sleep. The rescue crew will find you.",
        rescued: "The rescue crew has arrived.",
        scene: "The Mars base with its greenhouse and solar panels"
      },
      phases: { morning: "Morning", day: "Day", evening: "Evening", night: "Night" },
      solar: {
        archive: "NASA archive",
        unavailable: "NASA data pending",
        liveUnavailable: "Live NASA data is unavailable.",
        live: "Live NASA data · {date}"
      }
    },
    ru: {
      game: {
        title: "Один сол до помощи",
        intro: "Поддерживай работу марсианской базы до прибытия помощи.",
        turn: "Сол {sol} из {total} · {phase}",
        oxygen: "Кислород",
        food: "Еда",
        energy: "Энергия",
        addAir: "Дать энергию очистителю",
        next: "Начать день",
        end: "Завершить сол",
        advance: "Подвести итоги сола",
        restart: "Начать заново",
        emergencySleep: "Аварийный сон. Спасатели найдут тебя.",
        rescued: "Спасатели прибыли.",
        scene: "Марсианская база с теплицей и солнечными панелями"
      },
      phases: { morning: "Утро", day: "День", evening: "Вечер", night: "Ночь" },
      solar: {
        archive: "Архив NASA",
        unavailable: "Ожидаются данные NASA",
        liveUnavailable: "Свежие данные NASA недоступны.",
        live: "Свежие данные NASA · {date}"
      }
    }
  };
  function t(lang, key, vars = {}) {
    const catalog = TEXT[lang] ?? TEXT.en;
    const value = key.split(".").reduce((node, part) => node?.[part], catalog);
    if (typeof value !== "string") throw new RangeError(`Missing text: ${lang}.${key}`);
    return value.replace(/\{(\w+)\}/g, (token, name) => String(vars[name] ?? token));
  }

  // src/ui.js
  async function mountGame(root) {
    let lang = "en";
    const solarData = await loadSolarData();
    newGame({ solarData });
    const copy = (key, vars) => t(lang, key, vars);
    function render() {
      document.documentElement.lang = lang;
      document.title = copy("game.title");
      root.querySelector("#game-title").textContent = document.title;
      root.querySelector("#intro").textContent = copy("game.intro");
      const base = root.querySelector("#base");
      base.setAttribute("aria-label", copy("game.scene"));
      base.innerHTML = renderBase(STATE);
      root.querySelector("#sol").textContent = copy("game.turn", {
        sol: STATE.sol,
        total: CONFIG.missionSols,
        phase: copy(`phases.${STATE.phase}`)
      });
      for (const [id, value] of Object.entries({ oxygen: STATE.oxygen, food: STATE.food, energy: STATE.cubes })) {
        root.querySelector(`#${id}-label`).textContent = copy(`game.${id}`);
        root.querySelector(`#${id}`).textContent = value;
      }
      const solarKey = solarData.mode === "live" ? "solar.live" : solarData.flares.length ? "solar.archive" : "solar.unavailable";
      root.querySelector("#solar").textContent = copy(solarKey, { date: solarData.asOf });
      root.querySelector("#outcome").textContent = STATE.status === "playing" ? "" : copy(`game.${STATE.status}`);
      const actions2 = { air: "addAir", next: "next", end: "end", advance: "advance", restart: "restart" };
      for (const [id, key] of Object.entries(actions2)) {
        root.querySelector(`#${id}`).textContent = copy(`game.${key}`);
      }
      const playing = STATE.status === "playing";
      root.querySelector("#air").disabled = !playing || STATE.phase !== "day" || STATE.cubes === 0 || STATE.alloc.air >= CONFIG.airUseByCubes.length - 1;
      root.querySelector("#next").disabled = !playing || STATE.phase !== "morning";
      root.querySelector("#end").disabled = !playing || STATE.phase !== "day";
      root.querySelector("#advance").disabled = !playing || STATE.phase !== "evening";
      root.querySelector("#language").lang = lang === "en" ? "ru" : "en";
      root.querySelector("#language").textContent = lang === "en" ? "Русский" : "English";

    <header>
      <h1 id="game-title"></h1>
      <button type="button" id="language"></button>
    </header>
    <p id="intro"></p>
    <p id="sol" aria-live="polite"></p>

      <div><dt id="food-label"></dt><dd id="food"></dd></div>
      <div><dt id="energy-label"></dt><dd id="energy"></dd></div>

    <p id="solar"></p>

      <button type="button" id="air"></button>
      <button type="button" id="end"></button>
      <button type="button" id="advance"></button>
      <button type="button" id="restart"></button>
    </div>
    <p id="outcome" role="status"></p>`;
    const actions = {
      language: () => {
        lang = lang === "en" ? "ru" : "en";
      },
      next: skipToDecision,
      air: () => allocate("air", 1),
      end: endSol,
      advance: () => tick((CONFIG.phasesMs.evening + CONFIG.phasesMs.night) / STATE.speed),
      restart: () => newGame({ solarData })
    };
    for (const [id, action] of Object.entries(actions)) {
      root.querySelector(`#${id}`).addEventListener("click", () => {
        action();
        render();
      });
    }
    render();
  }

  // src/main.js
  mountGame(document.querySelector("#game"));
})();
</script>
