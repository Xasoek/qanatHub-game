          meta.scrubberLog = logEntry(key);
        }
        break;
      case "dustyPanels":
        if (choice === "clean") {
          block(["farm", "repair"], logEntry(key));
        } else {
          const panels = STATE.panels.total - downPanels() > 0 ? 1 : 0;
          STATE.panels.dusty += panels;
          logEntry(key, { panels });
        }
        break;
      case "roverCrate": {
        if (choice === "stay") {
          logEntry(key);
          break;
        }
        const rule = rulesFor.rover;
        STATE[choice] += rule[choice];
        const damage = chance(rule.stormRisk) ? addDamage(rule.stormDamage) : 0;
        block(["farm"], logEntry(key, { [choice]: -rule[choice], damage }));
        break;
      }
      case "coldNight": {
        const rule = rulesFor.coldNight;
        if (choice === "heat") {
          STATE.cubes -= rule.extraCubes;
          logEntry(key, { cubes: rule.extraCubes });
        } else {
          const before = STATE.crop.progress;
          STATE.fatigue += rule.fatigue;
          STATE.crop.progress = Math.max(0, before - rule.cropSteps);
          logEntry(key, { fatigue: rule.fatigue, crop: before - STATE.crop.progress });
        }
        break;
      }
      default:
        break;
    }
  }
  function resolveEvent(id, choice) {
    const event = meta.active;
    if (STATE.status !== "playing" || !event || event.id !== id) return false;
    const option = event.choices.find((item) => item.id === choice);
    if (!option || (option.spend ?? 0) > STATE.cubes) return false;
    meta.active = null;
    applyChoice(event, choice);
    if (updateStatus()) finishGame();
    else activateNext();
    return true;
  }
  function settleDay() {
    const siteRules = rules();
    const { alloc } = STATE;
    const airLevel = alloc.air >= siteRules.airFullCubes ? 2 : alloc.air > 0 ? 1 : 0;
    const baseLoss = CONFIG.airUseByCubes[airLevel];
    const faults = CONFIG.oxygenMultiplier;
    let factor = 1;
    if (STATE.scrubberBroken) factor *= faults.scrubberBroken;
    if (STATE.damage > CONFIG.leakDamage) factor *= faults.leak;
    const oxygenLoss = factor > 1 ? Math.max(baseLoss, faults.minLossWhenFaulty) * factor : baseLoss;
    if (baseLoss > 0) logEntry("air.low", { oxygen: baseLoss });
    if (STATE.scrubberBroken && oxygenLoss > baseLoss) {
      addEffect(meta.scrubberLog, "scrubberBroken", { oxygen: round(oxygenLoss - baseLoss) });
    }
    STATE.oxygen = Math.max(0, round(STATE.oxygen - oxygenLoss));
    if (unlocked("farm")) {
      const crop = CONFIG.crops[STATE.crop.type];
      const farmBlocked = meta.blocked.includes("farm");
      const steps = farmBlocked ? 0 : alloc.farm * CONFIG.farm.stepPerCube;
      if (steps > 0) {
        STATE.crop.progress += steps;
        if (STATE.crop.progress >= crop.sols) {
          STATE.crop.progress = 0;
          STATE.food += crop.food;
          logEntry("farm.harvest", { food: -crop.food });
        }
      } else if (siteRules.cropWilts && STATE.crop.progress > 0) {
        const lost = Math.min(STATE.crop.progress, CONFIG.farm.wiltSteps);
        STATE.crop.progress -= lost;
        if (farmBlocked) addEffect(meta.blockedBy.farm, "wilt", { crop: lost });
        else logEntry("farm.skip", { crop: lost });
      }
    }
    let repair = alloc.repair;
    const fixCost = CONFIG.repair.cubesPerFix;
    if (STATE.scrubberBroken && repair >= fixCost) {
      STATE.scrubberBroken = false;
      repair -= fixCost;
    }
    while (repair >= fixCost && downPanels() > 0) {
      if (STATE.panels.broken) STATE.panels.broken -= 1;
      else STATE.panels.dusty -= 1;
      repair -= fixCost;
    }
    STATE.damage = Math.max(0, STATE.damage - repair * CONFIG.repair.damagePerCube);
    meta.samples += alloc.science;
    STATE.stars = CONFIG.science.starSamples.filter((samples) => meta.samples >= samples).length;
    if (alloc.comms > 0) meta.forecastAsked = true;
    const food = Math.min(STATE.food, CONFIG.foodUsePerSol);
    STATE.food = round(STATE.food - food);
    logEntry("sol.end", { oxygen: oxygenLoss, food });
  }
  function settleNight() {
    if (unlocked("heat")) {
      const heated = meta.blackoutNight == null && STATE.alloc.heat >= rules().heatCubes;
      if (heated) {
        STATE.fatigue = Math.max(0, STATE.fatigue - CONFIG.heat.fatigueRecovery);
        meta.coldNights = 0;
      } else {
        const fatigue = CONFIG.heat.fatigueWithoutHeat;
        STATE.fatigue += fatigue;
        meta.coldNights += 1;
        let index = meta.blackoutNight;
        if (index == null) index = logEntry("heat.skip", { fatigue });
        else addEffect(index, "cold", { fatigue });
        const cold = CONFIG.consequences.cold;
        if (meta.coldNights >= cold.nightsWithoutHeat) {
          meta.coldNights = 0;
          addPending({
            kind: "cold",
            logIndex: index,
            triggerSol: STATE.sol + 1,
            sols: cold.sols,
            cubes: cold.cubes
          });
        }
      }
    }
    meta.blackoutNight = null;
    const crack = CONFIG.consequences.crack;
    if (STATE.damage > crack.damageAbove) {
      meta.damageStreak += 1;
      if (meta.damageStreak >= crack.streakSols) {
        meta.damageStreak = 0;
        const index = logEntry("repair.neglect", { damage: 0 });
        addPending({
          kind: "crack",
          logIndex: index,
          triggerSol: STATE.sol + randInt(...crack.delaySols),
          damage: crack.damage
        });
      }
    } else {
      meta.damageStreak = 0;
    }
  }
  function updateStatus() {
    if (STATE.status !== "playing") return false;
    if (STATE.oxygen <= 0 || STATE.food <= 0 || STATE.damage >= CONFIG.damageLimit) {
      STATE.status = "emergencySleep";
    } else if (STATE.phase === "evening" && STATE.sol >= CONFIG.missionSols) {
      STATE.status = "rescued";
    } else {
      return false;
    }
    return true;
  }
  function finishGame() {
    meta.active = null;
    meta.queue = [];
    meta.autoPaused = false;
    STATE.paused = false;
    if (!meta.presentation) clearSave();
    emit("gameover", getEndReport());
  }
  function setPhase(phase) {
    STATE.phase = phase;
    meta.elapsedInPhase = 0;
    let ended = false;
    if (phase === "evening") {
      STATE.cubes = 0;
      settleDay();
      ended = updateStatus();
    }
    emit("phase", { sol: STATE.sol, phase });
    if (ended) finishGame();
    else if (phase === "day") activateNext();
  }
  function finishSol() {
    settleNight();
    STATE.sol += 1;
    startSol();
    if (STATE.status !== "playing") return;
    setPhase("morning");
    save();
  }
  function advancePhase() {
    const next = PHASES[PHASES.indexOf(STATE.phase) + 1];
    if (next) setPhase(next);
    else finishSol();
  }
  function allocate(system, delta) {
    if (STATE.status !== "playing" || STATE.phase !== "day" || !CONFIG.systems.includes(system) || !Number.isInteger(delta) || !unlocked(system) || meta.blocked.includes(system)) return false;
    const next = STATE.alloc[system] + delta;
    if (next < 0 || next > CONFIG.maxAlloc[system] || STATE.cubes - delta < 0) return false;
    STATE.alloc[system] = next;
    STATE.cubes -= delta;
    return true;
  }
  function endSol() {
    if (STATE.status !== "playing" || !["morning", "day"].includes(STATE.phase)) return false;
    if (STATE.phase === "morning") setPhase("day");
    while (meta.active && STATE.status === "playing") {
      resolveEvent(meta.active.id, meta.active.defaultChoice);
    }
    if (STATE.status === "playing") setPhase("evening");
    return true;
  }
  function tick(dtMs) {
    if (!Number.isFinite(dtMs) || dtMs < 0) throw new RangeError("dtMs must be non-negative and finite");
    if (STATE.status !== "playing") return;
    const event = meta.active;
    if (event?.timeoutMs != null) {
      event.remainingMs = Math.max(0, event.remainingMs - dtMs);
      if (event.remainingMs === 0) resolveEvent(event.id, event.defaultChoice);
      return;
    }
    if (STATE.paused || event) return;
    let remaining = dtMs * STATE.speed;
    while (remaining > 0 && !STATE.paused && !meta.active && STATE.status === "playing") {
      const timeLeft = CONFIG.phasesMs[STATE.phase] - meta.elapsedInPhase;
      if (remaining < timeLeft) {
        meta.elapsedInPhase += remaining;
        return;
      }
      remaining -= timeLeft;
      advancePhase();
    }
  }
  function skipToDecision() {
    if (STATE.status !== "playing" || meta.active || STATE.phase === "day") return false;
    do
      advancePhase();
    while (STATE.status === "playing" && STATE.phase !== "day");
    return true;
  }
  function storage() {
    try {
      return globalThis.localStorage ?? null;
    } catch {
      return null;
    }
  }
  function save() {
    try {
      const store = storage();
      if (!store || STATE.status !== "playing" || meta.presentation) return false;
      store.setItem(CONFIG.saveKey, JSON.stringify({ v: CONFIG.saveVersion, state: STATE, meta }));
      return true;
    } catch {
      return false;
    }
  }
  function clearSave() {
    try {
      storage()?.removeItem(CONFIG.saveKey);
    } catch {
    }
  }
  function costScore(cost) {
    return Object.entries(cost ?? {}).reduce((sum, [key, value]) => sum + (Number.isFinite(value) ? value * (CONFIG.costWeights[key] ?? 0) : 0), 0);
  }
  function getEndReport() {
    const chains = STATE.log.map((entry, index) => ({ entry, index })).filter(({ entry }) => !OUTCOMES.has(entry.choice)).map(({ entry, index }) => {
      const effects = meta.effects.filter((effect) => effect.logIndex === index).map(({ sol, kind, cost }) => ({ sol, kind, cost }));
      const score = costScore(entry.cost) + effects.reduce((sum, effect) => sum + costScore(effect.cost), 0);
      return { sol: entry.sol, choice: entry.choice, cost: entry.cost, effects, score: round(score) };
    }).filter((chain) => chain.score > 0).sort((a, b) => b.score - a.score || a.sol - b.sol).slice(0, 3);
    return {
      status: STATE.status,
      sol: STATE.sol,
      chains,
      oxygen: STATE.oxygen,
      food: STATE.food,
      damage: STATE.damage,
      panelsWorking: STATE.panels.total - downPanels(),
      stars: STATE.stars
    };
  }
  newGame();

  // src/text.js
  var TEXT = {
    en: {
      game: {
        title: "One Sol to Rescue",
        intro: "Keep the Mars base running until help arrives.",
        turn: "Sol {sol} of {total} · {phase}",
        oxygen: "Oxygen",
        food: "Food",
        energy: "Energy",
        addAir: "Power the air scrubber",
        next: "Start day",
        end: "End sol",
        advance: "Apply sol results",
        restart: "Restart",
        emergencySleep: "Emergency sleep. The rescue crew will find you.",
        rescued: "The rescue crew has arrived.",
        scene: "The Mars base with its greenhouse and solar panels"
      },
      phases: { morning: "Morning", day: "Day", evening: "Evening", night: "Night" },
      solar: {
        archive: "NASA archive",
        unavailable: "NASA data pending",
        liveUnavailable: "Live NASA data is unavailable.",
        live: "Live NASA data · {date}"
      }
    },
    ru: {
      game: {
        title: "Один сол до помощи",
        intro: "Поддерживай работу марсианской базы до прибытия помощи.",
        turn: "Сол {sol} из {total} · {phase}",
        oxygen: "Кислород",
        food: "Еда",
        energy: "Энергия",
        addAir: "Дать энергию очистителю",
        next: "Начать день",
        end: "Завершить сол",
        advance: "Подвести итоги сола",
        restart: "Начать заново",
        emergencySleep: "Аварийный сон. Спасатели найдут тебя.",
        rescued: "Спасатели прибыли.",
        scene: "Марсианская база с теплицей и солнечными панелями"
      },
      phases: { morning: "Утро", day: "День", evening: "Вечер", night: "Ночь" },
      solar: {
        archive: "Архив NASA",
        unavailable: "Ожидаются данные NASA",
        liveUnavailable: "Свежие данные NASA недоступны.",
        live: "Свежие данные NASA · {date}"
      }
    }
  };
  function t(lang, key, vars = {}) {
    const catalog = TEXT[lang] ?? TEXT.en;
    const value = key.split(".").reduce((node, part) => node?.[part], catalog);
    if (typeof value !== "string") throw new RangeError(`Missing text: ${lang}.${key}`);
    return value.replace(/\{(\w+)\}/g, (token, name) => String(vars[name] ?? token));
  }

  // src/ui.js
  async function mountGame(root) {
    let lang = "en";
    const solarData = await loadSolarData();
    newGame({ solarData });
    const copy = (key, vars) => t(lang, key, vars);
    function render() {
      document.documentElement.lang = lang;
      document.title = copy("game.title");
      root.querySelector("#game-title").textContent = document.title;
      root.querySelector("#intro").textContent = copy("game.intro");
      const base = root.querySelector("#base");
      base.setAttribute("aria-label", copy("game.scene"));
      base.innerHTML = renderBase(STATE);
      root.querySelector("#sol").textContent = copy("game.turn", {
        sol: STATE.sol,
        total: CONFIG.missionSols,
        phase: copy(`phases.${STATE.phase}`)
      });
      for (const [id, value] of Object.entries({ oxygen: STATE.oxygen, food: STATE.food, energy: STATE.cubes })) {
        root.querySelector(`#${id}-label`).textContent = copy(`game.${id}`);
        root.querySelector(`#${id}`).textContent = value;
      }
      const solarKey = solarData.mode === "live" ? "solar.live" : solarData.flares.length ? "solar.archive" : "solar.unavailable";
      root.querySelector("#solar").textContent = copy(solarKey, { date: solarData.asOf });
      root.querySelector("#outcome").textContent = STATE.status === "playing" ? "" : copy(`game.${STATE.status}`);
      const actions2 = { air: "addAir", next: "next", end: "end", advance: "advance", restart: "restart" };
      for (const [id, key] of Object.entries(actions2)) {
        root.querySelector(`#${id}`).textContent = copy(`game.${key}`);
      }
      const playing = STATE.status === "playing";
      root.querySelector("#air").disabled = !playing || STATE.phase !== "day" || STATE.cubes === 0 || STATE.alloc.air >= CONFIG.airUseByCubes.length - 1;
      root.querySelector("#next").disabled = !playing || STATE.phase !== "morning";
      root.querySelector("#end").disabled = !playing || STATE.phase !== "day";
      root.querySelector("#advance").disabled = !playing || STATE.phase !== "evening";
      root.querySelector("#language").lang = lang === "en" ? "ru" : "en";
      root.querySelector("#language").textContent = lang === "en" ? "Русский" : "English";
    }
    root.innerHTML = `
    <header>
      <h1 id="game-title"></h1>
      <button type="button" id="language"></button>
    </header>
    <p id="intro"></p>
    <p id="sol" aria-live="polite"></p>
    <dl class="resources">
      <div><dt id="oxygen-label"></dt><dd id="oxygen"></dd></div>
      <div><dt id="food-label"></dt><dd id="food"></dd></div>
      <div><dt id="energy-label"></dt><dd id="energy"></dd></div>
    </dl>
    <div id="base" role="img"></div>
    <p id="solar"></p>
    <div class="actions">
      <button type="button" id="next"></button>
      <button type="button" id="air"></button>
      <button type="button" id="end"></button>
      <button type="button" id="advance"></button>
      <button type="button" id="restart"></button>
    </div>
    <p id="outcome" role="status"></p>`;
    const actions = {
      language: () => {
        lang = lang === "en" ? "ru" : "en";
      },
      next: skipToDecision,
      air: () => allocate("air", 1),
      end: endSol,
      advance: () => tick((CONFIG.phasesMs.evening + CONFIG.phasesMs.night) / STATE.speed),
      restart: () => newGame({ solarData })
    };
    for (const [id, action] of Object.entries(actions)) {
      root.querySelector(`#${id}`).addEventListener("click", () => {
        action();
        render();
      });
    }
    render();
  }

  // src/main.js
  mountGame(document.querySelector("#game"));
})();
</script>
</body>
